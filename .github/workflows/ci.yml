name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-checks:
    name: Backend Tests & Production Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: landscapemastery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System & Deployment Checks
        env:
          JWT_SECRET: "ci-test-cryptographically-secure-random-jwt-secret-key-at-least-64-characters-long"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: landscapemastery
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          cd backend
          python manage.py check
          python manage.py check --deploy

      - name: Run Backend Automated Test Suite
        env:
          JWT_SECRET: "ci-test-cryptographically-secure-random-jwt-secret-key-at-least-64-characters-long"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: landscapemastery
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          cd backend
          python manage.py test api company

  frontend-build:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: [backend-checks, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "===> Pulling latest changes from GitHub main..."
            cd /opt/3capstech
            git fetch origin main
            git reset --hard origin/main

            echo "===> Building and launching production containers..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "===> Ensuring shared gateway connectivity..."
            docker network connect shared-gateway landscapemastery_frontend || true

            echo "===> Reloading gateway Nginx proxy..."
            docker exec attendance_app-nginx-1 nginx -s reload || true

            echo "===> Checking container status..."
            docker compose -f docker-compose.prod.yml ps

            echo "===> Verifying internal health check..."
            curl -f http://127.0.0.1:8082/api/health/ || exit 1

            echo "===> Deployment successfully finished!"
